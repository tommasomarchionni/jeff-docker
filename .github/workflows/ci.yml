name: CI

# Static checks, unit tests, docs build and an image build on every push/PR.
# The full end-to-end API test lives in smoke-test.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: shellcheck docker/entrypoint.sh tests/run-tests.sh

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile
          config: .hadolint.yaml

  compose:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i 's/^JEFF_API_KEYS=.*/JEFF_API_KEYS=ci-dummy/' .env
          docker network create dokploy-network
          for f in docker-compose.yml docker-compose.prebuilt.yml docker-compose.dokploy.yml; do
            echo "::group::$f"; docker compose -f "$f" config -q; echo "::endgroup::"
          done
          docker compose -f docker-compose.yml -f docker-compose.rocm.experimental.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.nvidia.experimental.yml config -q

  unit-tests:
    name: Unit tests (bats)
    runs-on: ubuntu-latest
    needs: [shellcheck]
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats
      - name: Run entrypoint unit tests
        run: bats tests/test_entrypoint.bats

  docs:
    name: Docs build (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [hadolint, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: jeff-docker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fails fast without JEFF_API_KEYS
        run: |
          set +e
          docker run --rm jeff-docker:ci 2>&1 | tee /tmp/out.log
          grep -q "JEFF_API_KEYS is empty" /tmp/out.log
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id jeff-docker:ci -u)" = "10001"
      - name: Ships CPU-only PyTorch (no CUDA stack)
        run: |
          docker run --rm --entrypoint python jeff-docker:ci -c \
            "import torch, onnxruntime, jeff.server.main; assert '+cpu' in torch.__version__, torch.__version__; print(torch.__version__)"
          ! docker run --rm --entrypoint pip jeff-docker:ci list 2>/dev/null | grep -iE '^(nvidia|triton)'
      - name: Image size
        run: docker image ls jeff-docker:ci
